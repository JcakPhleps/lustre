<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Lustre</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="linen">
  <div id="app">
    <!-- ============ SCREENS MOUNT HERE ============ -->
    <div id="screen" class="body"><!-- app.js renders here --></div>
  </div>

  <!-- ============ NEW CHAT MODAL ============ -->
  <div class="overlay" id="newChatOverlay">
    <div class="card">
      <h1 style="font-size:20px">New Message</h1>
      <div class="tag">Start a direct message or a group</div>
      <label>People (comma-separated usernames)</label>
      <input class="input" id="newChatPeople" placeholder="alex, sam, jordan" />
      <label>Group name <span style="font-weight:400;color:#9aa0a8">(optional)</span></label>
      <input class="input" id="newChatName" placeholder="Weekend Crew" />
      <div class="err" id="newChatErr"></div>
      <div class="row">
        <button class="btn" id="newChatCancel">Cancel</button>
        <button class="btn blue" id="newChatCreate">Create</button>
      </div>
    </div>
  </div>

  <!-- ============ FRIENDS MODAL ============ -->
  <div class="overlay" id="friendsOverlay">
    <div class="card">
      <h1 style="font-size:20px">Friends</h1>
      <label>Add a friend by username</label>
      <div style="display:flex;gap:8px;align-items:stretch">
        <input class="input" id="friendAdd" placeholder="username" style="flex:1" autocapitalize="none" spellcheck="false" />
        <button class="btn blue" id="friendAddBtn">Add</button>
      </div>
      <div class="err" id="friendErr"></div>
      <div id="friendReqSection" class="hidden">
        <div class="sectionhead">Requests</div>
        <div id="friendReqList" class="friendlist"></div>
      </div>
      <div class="sectionhead">Your friends</div>
      <div id="friendList" class="friendlist"><div class="muted">No friends yet.</div></div>
      <div class="row"><button class="btn" id="friendsClose">Done</button></div>
    </div>
  </div>

  <!-- ============ ACCOUNT MODAL ============ -->
  <div class="overlay" id="accountOverlay">
    <div class="card">
      <h1 style="font-size:20px">Account</h1>
      <div class="tag" id="accountWho">—</div>
      <label>Display name</label>
      <input class="input" id="accountName" />
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-top:14px;font-weight:400">
        <input type="checkbox" id="accountSound" /> Message sounds
      </label>
      <div class="err" id="accountErr"></div>
      <div class="row">
        <button class="btn" id="accountSignout">Sign out</button>
        <button class="btn blue" id="accountSave">Save</button>
      </div>
      <div class="muted" id="accountMode"></div>
    </div>
  </div>

  <!-- ============ CALL STAGE ============ -->
  <div class="callstage" id="callStage">
    <div class="callgrid" id="callGrid"><!-- video tiles --></div>
    <div class="callbar">
      <button class="cbtn" id="callMute">Mute</button>
      <button class="cbtn" id="callVideo">Camera</button>
      <button class="cbtn hang" id="callHang">End Call</button>
    </div>
  </div>

  <!-- ============ INCOMING CALL ============ -->
  <div class="overlay" id="incomingOverlay">
    <div class="card incoming-call">
      <div class="tag">Incoming call…</div>
      <div class="big" id="incomingName">Someone</div>
      <div class="muted" id="incomingKind">Video call</div>
      <div class="row">
        <button class="btn red" id="incomingDecline">Decline</button>
        <button class="btn green" id="incomingAccept">Accept</button>
      </div>
    </div>
  </div>

  <!-- hidden file input for image attachments -->
  <input type="file" id="imgInput" accept="image/*" class="hidden" />

  <script type="module" src="js/app.js"></script>
</body>
</html>
