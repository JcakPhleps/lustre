<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Lustre</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/aero.css" />
</head>
<body class="linen">
  <div id="app">
    <!-- ============ SCREENS MOUNT HERE ============ -->
    <div id="screen" class="body"><!-- app.js renders here --></div>
  </div>

  <!-- ============ NEW CHAT MODAL ============ -->
  <div class="overlay" id="newChatOverlay">
    <div class="card">
      <h1 style="font-size:20px">New Message</h1>
      <div class="tag">Start a direct message or a group</div>
      <label>People (comma-separated usernames)</label>
      <input class="input" id="newChatPeople" placeholder="alex, sam, jordan" />
      <label>Group name <span style="font-weight:400;color:#9aa0a8">(optional)</span></label>
      <input class="input" id="newChatName" placeholder="Weekend Crew" />
      <div class="err" id="newChatErr"></div>
      <div class="row">
        <button class="btn" id="newChatCancel">Cancel</button>
        <button class="btn blue" id="newChatCreate">Create</button>
      </div>
    </div>
  </div>

  <!-- ============ FRIENDS MODAL ============ -->
  <div class="overlay" id="friendsOverlay">
    <div class="card">
      <h1 style="font-size:20px">Friends</h1>
      <label>Add a friend by username</label>
      <div style="display:flex;gap:8px;align-items:stretch">
        <input class="input" id="friendAdd" placeholder="username" style="flex:1" autocapitalize="none" spellcheck="false" />
        <button class="btn blue" id="friendAddBtn">Add</button>
      </div>
      <div class="err" id="friendErr"></div>
      <div id="friendReqSection" class="hidden">
        <div class="sectionhead">Requests</div>
        <div id="friendReqList" class="friendlist"></div>
      </div>
      <div class="sectionhead">Your friends</div>
      <div id="friendList" class="friendlist"><div class="muted">No friends yet.</div></div>
      <div class="sectionhead">People you may know</div>
      <div id="friendSuggest" class="friendlist"><div class="muted">—</div></div>
      <div class="row"><button class="btn" id="friendsClose">Done</button></div>
    </div>
  </div>

  <!-- ============ SETTINGS MODAL ============ -->
  <div class="overlay" id="settingsOverlay">
    <div class="card settings-card">
      <h1 style="font-size:20px">Settings</h1>
      <div class="settings-scroll">
        <div class="sectionhead">Profile</div>
        <div class="tag" id="settingsWho" style="text-align:left;margin:0 0 8px">—</div>
        <label>Profile picture</label>
        <div class="pfp-edit">
          <div class="avatar lg" id="setPfpPreview"></div>
          <div class="pfp-controls">
            <button class="btn" id="setPfpUpload">Upload…</button>
            <button class="btn" id="setPfpRemove">Remove</button>
          </div>
        </div>
        <div class="pfp-presets" id="setPfpPresets"></div>
        <label>Display name</label>
        <input class="input" id="setName" maxlength="32" />
        <div class="hint" id="setNameHint"></div>
        <label>Username</label>
        <div class="userfield"><span>@</span><input class="input" id="setUsername" maxlength="20" autocapitalize="none" spellcheck="false" /></div>
        <div class="hint" id="setUsernameHint"></div>
        <label>Bio <span class="opt">(optional)</span></label>
        <textarea class="input" id="setBio" rows="3" maxlength="160" placeholder="A little about you…"></textarea>
        <div class="hint" id="setBioHint"></div>
        <button class="btn" id="setViewCard" style="width:100%;margin-top:10px">View my profile card</button>

        <div class="sectionhead">Appearance</div>
        <label>Style</label>
        <div class="segmented" id="setTheme"></div>
        <label>Accent color</label>
        <div class="swatches" id="setAccent"></div>
        <div id="setWallRow">
          <label>Chat wallpaper</label>
          <div class="swatches" id="setWall"></div>
        </div>
        <label>Text size</label>
        <div class="segmented" id="setSize"></div>

        <div class="sectionhead">Chat</div>
        <label class="toggle"><input type="checkbox" id="setEnter"> <span>Press Enter to send</span></label>
        <label class="toggle"><input type="checkbox" id="setReceipts"> <span>Show read receipts</span></label>
        <label class="toggle"><input type="checkbox" id="setSound"> <span>Message sounds</span></label>
        <label class="toggle"><input type="checkbox" id="setNotify"> <span>Desktop notifications (messages & calls)</span></label>
        <label>Sound pack</label>
        <div class="segmented" id="setPack"></div>

        <div class="sectionhead">Account</div>
        <label style="margin-top:0">Recovery email <span class="opt">(optional)</span></label>
        <input class="input" id="setEmail" type="email" placeholder="you@email.com" autocapitalize="none" spellcheck="false" style="margin-bottom:10px" />
        <button class="btn" id="setChangePw" style="width:100%">Change password…</button>
        <div id="pwArea" class="hidden" style="margin-top:8px">
          <input class="input" id="pwNew" type="password" placeholder="New password (6+ characters)" />
          <button class="btn blue" id="pwSave" style="width:100%;margin-top:6px">Update password</button>
        </div>

        <div class="sectionhead">About</div>
        <div class="muted" style="text-align:left">
          <a href="privacy.html" target="_blank" class="link">Privacy Policy</a> &nbsp;·&nbsp;
          <a href="terms.html" target="_blank" class="link">Terms of Service</a> &nbsp;·&nbsp;
          <span class="link" id="setWhatsNew">What's New</span>
        </div>
      </div>
      <div class="err" id="setErr"></div>
      <div class="row">
        <button class="btn red" id="setSignout">Sign out</button>
        <button class="btn blue" id="setSave">Save</button>
      </div>
      <div class="muted" id="setMode"></div>
    </div>
  </div>

  <!-- ============ CHANGELOG ("What's New") ============ -->
  <div class="overlay" id="changelogOverlay">
    <div class="card settings-card">
      <h1 style="font-size:20px">What's New</h1>
      <div class="settings-scroll" id="changelogBody"></div>
      <div class="row"><button class="btn" id="changelogClose">Done</button></div>
    </div>
  </div>

  <!-- ============ CALL STAGE ============ -->
  <div class="callstage" id="callStage">
    <div class="callgrid" id="callGrid"><!-- video tiles --></div>
    <div class="callbar">
      <button class="cbtn" id="callMute">Mute</button>
      <button class="cbtn" id="callVideo">Camera</button>
      <button class="cbtn hang" id="callHang">End Call</button>
    </div>
  </div>

  <!-- ============ INCOMING CALL ============ -->
  <div class="overlay" id="incomingOverlay">
    <div class="card incoming-call">
      <div class="tag">Incoming call…</div>
      <div class="big" id="incomingName">Someone</div>
      <div class="muted" id="incomingKind">Video call</div>
      <div class="row">
        <button class="btn red" id="incomingDecline">Decline</button>
        <button class="btn green" id="incomingAccept">Accept</button>
      </div>
    </div>
  </div>

  <!-- hidden file inputs -->
  <input type="file" id="imgInput" accept="image/*" class="hidden" />
  <input type="file" id="pfpInput" accept="image/*" class="hidden" />

  <script type="module" src="js/app.js"></script>
</body>
</html>
